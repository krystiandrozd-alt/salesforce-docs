version: "0.2.0"
as_of: "2026-11-22"
purpose: "Source routing and process-to-license relationship contract, not a merged corpus"
reference_registry: "reference-registry.yaml"
capability_commercial_contract: "docs/capability-commercial-contract.md"
resolver_prompt: "prompts/resolve-process-commercial.md"
resolver_runtime_status: "SYNTHETIC_STRUCTURAL_PILOT_ONLY"
resolver_entrypoint: "resolver.py"
resolver_quickstart: "RESOLVER-QUICKSTART.md"
resolver_fixture: "examples/wholesale-quote-to-order.synthetic.json"
resolver_tests: "tests/test_resolver.py"
skill_routing: "docs/skill-routing.md"
skill_benchmark_holdouts: "examples/skills-holdout-cases.json"
skill_benchmark_status: "NOT_EXECUTED"
reference_resolution: "Paths above are relative to solution-intelligence; paths in each layer are relative to that layer's root. Resolve refs to commit SHAs per run."
layers:
  technical:
    repo: "krystiandrozd-alt/salesforce-docs"
    ref: "master"
    root: "."
    entrypoints: ["README.md", "salesforce-platform-docs-content-list.md"]
    coverage: "54 product-specific indexes and source-linked summaries"
    priority_for: ["Salesforce platform/product APIs", "technical concepts"]
    verify_live_for: ["current GA/Beta status", "new capabilities", "security guidance"]
  headless:
    repo: "krystiandrozd-alt/headless-toolkit"
    ref: "master"
    root: "."
    entrypoints:
      - "README.md"
      - "get-started/content.md"
      - "headless-experience-layer-hxl-beta/content.md"
      - "hosted-mcp-servers/content.md"
      - "multi-framework-microfrontend/content.md"
      - "aiforce-claudeforce/salesforce-in-claude-skills-reference.md"
    priority_for: ["headless architecture", "functional skill discovery", "HXL", "hosted MCP", "multi-framework", "microfrontend"]
    verify_live_for: ["beta status", "supported surfaces", "API and MCP security", "licensing implications"]
  commercial:
    repo: "krystiandrozd-alt/salesforce-docs"
    ref: "feature/pricing-licensing-knowledge-graph-20261122"
    root: "pricing-intelligence"
    entrypoints:
      - "AGENTS.md"
      - "docs/agent-io-contract.md"
      - "schema/scenario.schema.json"
    agent_skill: "sf-pricing-intelligence"
    calculator: "credit_calculator.py"
    priority_for: ["commercial public list observations", "entitlement analysis", "supported Flex Credit calculation"]
    verify_live_for: ["price", "units", "buying model", "rate-card validity"]
evidence_statuses: ["VERIFIED", "INFERRED", "UNKNOWN", "CONFLICTED"]
pricing_status_adapter:
  SOURCE_VERIFIED: "VERIFIED for the same exact sourced assertion; preserve original status"
  RETIRED: "lifecycle_status only; do not treat as evidence confidence"
relationship_resolution:
  canonical_contract: "docs/capability-commercial-contract.md"
  stable_ids_required: true
  joins_by_display_name_forbidden: true
  claim_evidence_per_edge: true
  requirement_groups: ["ALL_OF", "ANY_OF"]
  semantic_matches: "CANDIDATES_ONLY"
  directions: ["process_to_commercial", "commercial_change_to_process"]
  preserve_product_generation: true
  distinguish_functional_and_delivery_skills: true
  verify_customer_applicability_separately: true
  preserve_existing_calculator_schema: true
unverified_never_zero: true
contracts_private: true
default_external_actions: "read-only"

